<!DOCTYPE html>
<html>

<head>
    <title>Student Authentication</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .developer-credit {
            position: fixed;
            bottom: 12px;
            right: 18px;
            font-size: 13px;
            color: #777;
            z-index: 1000;
        }
    </style>
</head>

<body>

    <div class="container {% if mode == 'signup' %}right-panel-active{% endif %}" id="container">

        <!-- SIGN UP FORM -->
        <div class="form-container sign-up-container">
            <form action="/signup" method="POST">
                <h1>Create Account</h1>
                <p>Register using your email and password</p>

                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>

                <button type="submit">SIGN UP</button>
            </form>
        </div>

        <!-- SIGN IN FORM -->
        <div class="form-container sign-in-container">
            <form action="/" method="POST">
                <h1>Sign In</h1>
                <p>Use your email and password</p>

                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>

                <button type="submit">SIGN IN</button>
            </form>
        </div>

        <!-- PURPLE ANIMATED PANEL -->
        <div class="overlay-container">
            <div class="overlay">

                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back..</h1>
                    <p>Already have an account ? Sign in to continue.</p><br><br><br><br><br><br>
                    <button class="ghost" id="signIn" type="button">SIGN IN</button>
                </div>

                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend..</h1>
                    <p>Register with your personal details to use all site features.</p><br><br><br>
                    <button class="ghost" id="signUp" type="button">SIGN UP</button>
                </div>

                <div style="position: fixed; bottom: 10px; right: 16px;
                             font-size: 15px; font-weight: 500;
                            color: #7c7b7b !important; z-index: 9999;">
                            Developed By Aniket...
                </div>

            </div>
        </div>

    </div>



    <script>
        const container = document.getElementById("container");

        document.getElementById("signUp").addEventListener("click", () => {
            container.classList.add("right-panel-active");
        });

        document.getElementById("signIn").addEventListener("click", () => {
            container.classList.remove("right-panel-active");
        });
    </script>

</body>

</html>
